
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARADOX LIVE - LYRIC QUIZ</title>
<style>
*{box-sizing:border-box}
body {
 margin:0;
 background:
  radial-gradient(ellipse at 15% 10%,rgba(139,60,255,.20),transparent 38%),
  radial-gradient(ellipse at 90% 30%,rgba(0,190,255,.13),transparent 35%),
  radial-gradient(ellipse at 50% 100%,rgba(255,40,180,.10),transparent 40%),
  #080712;
 color:#fff;
 font-family:Arial,"Noto Sans TC",sans-serif;
}
header{text-align:center;padding:42px 15px 25px}
.logo{font-size:36px;font-weight:900;letter-spacing:4px}
.logo span{color:#ed354d}
.subtitle{color:#999;letter-spacing:3px;font-size:11px;margin-top:9px}
main{max-width:1000px;margin:auto;padding:15px}
h2{text-align:center;font-size:20px;margin-top:30px}
.desc{text-align:center;color:#999;font-size:13px}


/* 調整畫面卡片大小 */
.teams {
 display: grid; grid-template-columns: repeat(3, 220px);
 justify-content: center; gap: 20px; margin-top: 28px;
}

.team {
 position: relative; background: #202029; border: 2px solid #363640; border-radius: 9px;
 overflow: hidden; cursor: pointer; transition: .2s; padding: 0;
 aspect-ratio: 5/4;
}

.team:hover{border-color:#ed354d;transform:translateY(-3px)}
.team.selected{border-color:#ed354d;box-shadow:0 0 15px #ed354d55}

/* Logo 色塊：填滿卡片 */
.team-logo {
 width: 100%;
 height: 100%;
 display: flex;
 align-items: center;
 justify-content: center;
}

/* Logo 圖片 */
.team-logo img {
 display: block;
 max-width: 85%;
 max-height: 85%;
 width: auto;
 height: auto;
 object-fit: contain;
}

.team img{
 display:block;width:100%;aspect-ratio:5/4; object-fit:contain; 
}

.team-name{
 padding:13px;text-align:center;font-weight:bold;
 background:#202029;font-size:14px
}
.team.selected .team-name{background:#722633}
.check{
 display:none;position:absolute;right:10px;top:10px;
 background:#ed354d;border-radius:50%;width:25px;
 height:25px;text-align:center;line-height:25px
}
.team.selected .check{display:block}
.actions{display:flex;justify-content:center;gap:10px;margin:20px}
.small-btn{
 padding:9px 20px;background:#292932;color:white;
 border:1px solid #555;border-radius:5px;cursor:pointer
}
.settings{
 max-width:500px;margin:35px auto;
 padding:25px;background:#1d1d25;border-radius:10px
}
label{display:block;margin:18px 0 9px;color:#ccc}
select{
 width:100%;padding:12px;background:#292932;
 color:white;border:1px solid #555;border-radius:5px;
 font-size:15px
}
.start{
 width:100%;margin-top:25px;padding:16px;
 border:0;border-radius:5px;background:#ed354d;
 color:white;font-size:17px;font-weight:bold;
 letter-spacing:3px;cursor:pointer
}
.start:disabled{opacity:.35;cursor:not-allowed}
footer{text-align:center;color:#666;padding:30px;font-size:11px}
@media(max-width:650px){
 .teams{grid-template-columns:repeat(2,1fr);gap:9px}
 .team-name{font-size:12px;padding:10px 4px}
 .logo{font-size:27px}
}
</style>
</head>
<body>

<header>
 <div class="logo">PARADOX <span>LIVE</span></div>
 <div class="subtitle">UNOFFICIAL FAN-MADE LYRIC QUIZ</div>
</header>

<main>

 <h2>SELECT YOUR BATTLE</h2>
 <p class="desc">選擇想挑戰的隊伍，可選擇單組或複數組</p>

 <div class="teams" id="teamList"></div>

 <div class="actions">
  <button class="small-btn" onclick="selectAll()">全選</button>
  <button class="small-btn" onclick="clearAll()">清除選擇</button>
 </div>

 <section class="settings">

  <label>題目數量 / QUESTION COUNT</label>
  <select id="count">
  <option value="1">1 題</option>
  <option value="2">2 題</option>
  <option value="3">3 題</option>
  <option value="4">4 題</option>
  <option value="5"  selected>5 題</option>
  <option value="6">6 題</option>
  <option value="7">7 題</option>
  <option value="8">8 題</option>
  <option value="9">9 題</option>
  <option value="10">10 題</option>
  <option value="11">11 題</option>
  <option value="12">12 題</option>
  </select>

  <button class="start" id="startBtn" disabled onclick="startGame()">
   START GAME →
  </button>

 </section>

</main>

<footer>
 PARADOX LIVE LYRIC QUIZ<br>
 UNOFFICIAL FAN-MADE PROJECT
</footer>

<script>

const teams = [
    {id:"bae",name:"BAE",image:"bae.png",color:"#ed354d"},
    {id:"tcw",name:"The Cat's Whiskers",image:"thecatswhiskers.png",color:"#005A9F"},
    {id:"cozmez",name:"cozmez",image:"cozmez.png",color:"#D9B3E0"},
    {id:"akanyatsura",name:"悪漢奴等",image:"akanyatsura.png",color:"#FACC53"},
    {id:"visty",name:"VISTY",image:"visty.png",color:"#F668B2"},
    {id:"amprule",name:"AMPRULE",image:"amprule.png",color:"#006F55"},
    {id:"1nm8",name:"1Nm8",image:"1nm8.png",color:"#BDC3C4"},
    {id:"gokuluck",name:"獄Luck",image:"gokuluck.png",color:"#F75A18"},
    {id:"buraikan",name:"武雷管",image:"buraikan.png",color:"#A38F3C"},
];

let selected=[];

const teamList=document.getElementById("teamList");

teams.forEach(team=>{

 const card=document.createElement("div");
 card.className="team";

 const check=document.createElement("div");
 check.className="check";
 check.textContent="✓";

 const logoBox=document.createElement("div");
 logoBox.className="team-logo";
 logoBox.style.backgroundColor=team.color;

 const img=document.createElement("img");
 img.src="images/"+team.image;
 img.alt=team.name;

 img.onerror=()=>{
  img.alt="請放入 "+team.name+" 圖片";
 };

 logoBox.appendChild(img);

 card.append(check,logoBox);

 card.onclick=()=>toggleTeam(team.id,card);

 teamList.appendChild(card);

});


function toggleTeam(id,card){

 if(selected.includes(id)){
  selected=selected.filter(x=>x!==id);
  card.classList.remove("selected");
 }else{
  selected.push(id);
  card.classList.add("selected");
 }

 updateButton();

}

function selectAll(){

 selected=teams.map(t=>t.id);

 document.querySelectorAll(".team").forEach(card=>{
  card.classList.add("selected");
 });

 updateButton();

}

function clearAll(){

 selected=[];

 document.querySelectorAll(".team").forEach(card=>{
  card.classList.remove("selected");
 });

 updateButton();

}

function updateButton(){

 document.getElementById("startBtn").disabled=
  selected.length===0;

}

function startGame(){

 if(selected.length===0)return;

 const params=new URLSearchParams();

 params.set("teams",selected.join(","));
 params.set("mode", "random");
 params.set("count",document.getElementById("count").value);

 location.href="game.html?"+params.toString();

}

</script>

</body>
</html>
